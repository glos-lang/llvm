name: CI

on: [push, pull_request]

permissions:
  contents: write

env:
  LLVM_VERSION: 22.1.4
  LLVM_BASE_URL: https://github.com/c3lang/llvm-for-c3/releases/download

jobs:
  build-linux-glibc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download LLVM
        run: |
          curl -L "${LLVM_BASE_URL}/llvm_${LLVM_VERSION}/llvm-linux-amd64.tar.xz" -o llvm.tar.xz
          mkdir llvm
          tar xf llvm.tar.xz -C llvm --strip-components=1

          cd llvm
          mkdir -p bin include/llvm

          mv usr/bin/llvm-config bin
          mv usr/include/llvm-c include
          mv usr/include/llvm/Config include/llvm

          rm -rf usr lib/liblld* lib/*.so* lib/cmake lib/linux

      - name: Archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tar cJf "llvm-linux-glibc-x86_64.tar.xz" llvm

      - name: Upload Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-glibc-x86_64
          path: llvm-linux-glibc-x86_64.tar.xz

  build-linux-musl:
    runs-on: ubuntu-latest

    container:
      image: alpine:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apk add --no-cache xz curl build-base zstd-static zlib-static

      - name: Download LLVM
        run: |
          curl -L "${LLVM_BASE_URL}/llvm_${LLVM_VERSION}/llvm-linux-amd64-musl.tar.xz" -o llvm.tar.xz
          mkdir llvm
          tar xf llvm.tar.xz -C llvm --strip-components=1

          cd llvm
          mkdir -p bin include/llvm

          mv usr/bin/llvm-config bin
          mv usr/include/llvm-c include
          mv usr/include/llvm/Config include/llvm

          rm -rf usr lib/liblld* lib/*.so* lib/cmake lib/linux

      - name: Archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tar cJf "llvm-linux-musl-x86_64.tar.xz" llvm

      - name: Upload Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-musl-x86_64
          path: llvm-linux-musl-x86_64.tar.xz

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download LLVM
        run: |
          curl -L "${LLVM_BASE_URL}/llvm_${LLVM_VERSION}/llvm-darwin-aarch64.tar.xz" -o llvm.tar.xz
          mkdir llvm
          tar xf llvm.tar.xz -C llvm --strip-components=1

          cd llvm
          mkdir -p bin include/llvm

          mv usr/bin/llvm-config bin
          mv usr/include/llvm-c include
          mv usr/include/llvm/Config include/llvm

          rm -rf usr lib/liblld* lib/cmake lib/darwin

      - name: Archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tar cJf "llvm-macos-arm64.tar.xz" llvm

      - name: Upload Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-arm64
          path: llvm-macos-arm64.tar.xz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download LLVM
        shell: bash
        run: |
          curl -L "${LLVM_BASE_URL}/llvm_${LLVM_VERSION}/llvm-windows-amd64.tar.xz" -o llvm.tar.xz
          mkdir llvm
          tar xf llvm.tar.xz -C llvm --strip-components=1

          cd llvm
          mkdir -p _bin _include/llvm

          mv bin/llvm-config _bin
          mv include/llvm-c _include
          mv include/llvm/Config _include/llvm

          rm -rf bin include share lib/lld* lib/cmake lib/windows

          mv _bin bin
          mv _include include

      - name: Archive
        shell: bash
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tar cJf "llvm-windows-x86_64.tar.xz" llvm

      - name: Upload Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-x86_64
          path: llvm-windows-x86_64.tar.xz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux-glibc, build-linux-musl, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-linux-glibc-x86_64/llvm-linux-glibc-x86_64.tar.xz
            build-linux-musl-x86_64/llvm-linux-musl-x86_64.tar.xz
            build-macos-arm64/llvm-macos-arm64.tar.xz
            build-windows-x86_64/llvm-windows-x86_64.tar.xz
